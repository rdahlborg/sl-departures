name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach firmware to releases
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe gives the firmware its version

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c6
          command: idf.py build && idf.py merge-bin -o firmware.bin

      - name: Assemble installer site
        run: |
          VERSION=$(git describe --tags --always)
          mkdir -p _site
          cp site/index.html screenshots/*.png _site/
          # Separate parts rather than the merged image, so updates leave
          # the NVS partition (Wi-Fi details, chosen station) untouched.
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
             build/sl-departures.bin _site/
          sed "s/__VERSION__/$VERSION/" site/manifest.json > _site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Attach firmware to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/firmware.bin

  deploy:
    # Pages only deploys from the default branch.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
